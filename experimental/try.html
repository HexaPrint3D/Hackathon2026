<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festival Finder Linz</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="festival-screen" class="screen">
    <div class="festival-shell">
      <header class="festival-header">
        <p class="eyebrow">Linz Festival Guide</p>
        <h1>Welches Festival willst du besuchen?</h1>
        <p class="helper">Wähle ein Event in Linz und starte direkt die Route.</p>
      </header>

      <div id="festival-list" class="festival-list" aria-live="polite"></div>
    </div>
  </div>

  <div id="main-screen" class="screen hidden">
    <div class="container">
      <header>
        <h1>Ars Electronica Kompass</h1>
        <p>KI-Guide für Standorte, Events & Services in Linz</p>
      </header>

      <div class="card">
        <div class="search-box">
          <input type="text" id="userInput" placeholder="Z. B. 'Wo gibt es Essen?', 'Klo' oder 'Technik Ausstellungen'" />
          <button type="button" onclick="searchWithAI()">Suchen</button>
        </div>
        <p id="status" style="margin-top: 10px;"></p>
      </div>

      <button id="back-to-festival" type="button" class="secondary-button">Zurück zur Festival-Auswahl</button>

      <div class="card" id="result-box">
        <h3 id="result-title">Gefundenes Ziel</h3>
        <p id="result-desc"></p>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
