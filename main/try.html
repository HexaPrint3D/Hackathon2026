<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festival Finder Linz</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="festival-screen" class="screen">
    <div class="festival-shell">
      <header class="festival-header">
        <p class="eyebrow">Linz Festival Guide</p>
        <h1>Which festival do you want to visit?</h1>
        <p class="helper">Choose an event in Linz and start the route immediately.</p>
      </header>

      <div id="festival-list" class="festival-list" aria-live="polite"></div>
    </div>
  </div>

  <div id="main-screen" class="screen hidden">
    <div class="container">
      <header>
        <h1>Linz Compass</h1>
        <p>AI guide for locations, events & services in Linz</p>
      </header>

      <div class="card">
        <div class="search-box">
          <input type="text" id="userInput" placeholder="            Search for stuff in Linz" aria-label="Search" />
          <button type="button" class="search-button" onclick="searchWithAI()" aria-label="Search">
            <span class="search-arrow" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
                <path d="M32 10v34" stroke="white" stroke-width="6" stroke-linecap="round"/>
                <path d="M18 26 L32 10 L46 26" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
        </div>
        <p id="status" style="margin-top: 10px;"></p>
      </div>

      <button id="back-to-festival" type="button" class="secondary-button">Back to festival selection</button>
      <button id="travel-planner-toggle" type="button" class="secondary-button travel-toggle">Plan transport</button>

      <div class="card" id="result-box">
        <h3 id="result-title">Found destination</h3>
        <p id="result-desc"></p>
      </div>

      <div id="transport-panel" class="transport-panel hidden" aria-live="polite">
        <div class="transport-header">
          <h3>Transport planner</h3>
          <button type="button" id="close-transport-panel" class="close-panel" aria-label="Close transport planner">×</button>
        </div>

        <div class="transport-form">
          <label>
            <span>From</span>
            <input id="transport-start" type="text" value="Your location" />
          </label>
          <label>
            <span>To</span>
            <input id="transport-end" type="text" value="Ars Electronica Festival" />
          </label>

          <div class="transport-meta">
            <label>
              <span>Date</span>
              <input id="transport-date" type="date" />
            </label>
            <label>
              <span>Departure</span>
              <input id="transport-time" type="time" />
            </label>
          </div>

          <button id="transport-search-button" class="primary-button" type="button">Search connection</button>
        </div>

        <div id="transport-results" class="transport-results">
          <p class="empty-state">Choose a route and compare options.</p>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <div class="dog-button-wrap">
    <a href="eatit.html"><button id="eat-button" class="eat-button" type="button">Let's eat it</button></a>
    <div id="dog-eater" class="dog-eater" aria-hidden="true">
      <span class="dog">🐶</span>
      <span class="crumb">🥖</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="festival-data.js"></script>
  <script src="script.js"></script>
  <button class="rickroll-btn" onclick="window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank')">Use Pro for Free</button>
</body>
</html>
